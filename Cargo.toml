[package]
name = "voicetype"
version = "0.1.0"
edition = "2024"
description = "Dictation for Wayland: speak, and the transcript is typed into the focused window"
license = "MIT"
repository = "https://github.com/nandanrao/voicetype"

[profile.release]
lto = true
strip = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
futures-util = "0.3.34"
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "multipart", "json"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.2.1"
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkeysym = "0.2.1"
zbus = { version = "6.3.0", default-features = false, features = ["tokio"] }
